spring:
  application:
    name: homestore-api
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HomeStoreDb;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:homestore_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    url: ${MIGRATION_DB_URL:${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=HomeStoreDb;encrypt=true;trustServerCertificate=true}}
    user: ${MIGRATION_DB_USERNAME}
    password: ${MIGRATION_DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-migration-naming: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
